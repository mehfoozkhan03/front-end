<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>block and inline element's</title>
    <style>
      /* 
        class represent with .
        id represent with #
     */
      .block {
        background-color: tomato;
      }
      #inline{
        background-color: teal;
        color: #fff;
      }
    </style>
  </head>
  <body>
    <div class="block">block:- take whole width of content.</div>
    <p class="block">block</p>
    <span id="inline">inline:- only take content width</span>
    <q id="inline">hello everyone</q>
  </body>
</html>
