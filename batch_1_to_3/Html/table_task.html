<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>table task</title>
  </head>
  <body>
    <table border="2">
      <thead>
        <tr>
          <th rowspan="4">day</th>
          <th colspan="4">seminar</th>
        </tr>
        <tr>
          <th colspan="2">schedule</th>
          <th colspan="2" rowspan="2">topic</th>
        </tr>
        <tr>
          <th>begin</th>
          <th>end</th>
        </tr>
      </thead>
      <tbody>
        <!-- MONDAY -->
        <tr>
          <td rowspan="2">monday</td>
          <td rowspan="2"  bgcolor="wheat">8:00am.</td>
          <td rowspan="2" bgcolor="#71a3c1">5:00pm.</td>

          <td align="center">introduction to XML</td>
        </tr>
        <tr>
          <td align="center">validity: DTD and relax NG</td>
        </tr>
        <!-- TUE DAY -->
        <tr>
          <td rowspan="3">tuesday</td>
          <td rowspan="1" bgcolor="wheat">8:00am.</td>
          <td rowspan="1" bgcolor="#71a3c1">11:00pm.</td>
          <td rowspan="2" align="center">XPath</td>
        </tr>
        <tr>
          <td rowspan="1" bgcolor="wheat">11:00am.</td>
          <td rowspan="1" bgcolor="#75ba75">2:00pm.</td>
        </tr>
        <tr>
          <td rowspan="1" bgcolor="#75ba75">2:00am.</td>
          <td rowspan="1" bgcolor="#71a3c1">5:00pm.</td>
          <td rowspan="1" align="center">XSL transformations</td>
        </tr>
      </tbody>
    </table>
  </body>
</html>
